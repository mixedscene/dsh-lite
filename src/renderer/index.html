<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="%VIEWPORT_CONTENT%"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Antigravity" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Antigravity" />
    <link rel="apple-touch-icon" href="./static/antigravity.svg" />
    <link rel="icon" href="./static/antigravity.svg" sizes="any" />
    <title>Antigravity</title>
    <script>
      var initialTheme = localStorage.getItem("initial-theme");
      if (initialTheme === "light" || initialTheme === "dark") {
        document.documentElement.setAttribute("data-theme", initialTheme);
        document.documentElement.setAttribute(
          "data-mantine-color-scheme",
          initialTheme
        );
      }
    </script>
    <style>
      html[data-theme="dark"] {
        background-color: #242424;
      }

      .splash-screen {
        position: fixed;
        z-index: 99999;
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        opacity: 1;
        background-color: #fff;
        overflow: hidden;
      }
      html[data-theme="dark"] .splash-screen {
        background-color: #242424;
      }

      .splash-screen-top {
        flex: 2;
      }
      .splash-screen-bottom {
        flex: 3;
        width: 100%;
        position: relative;
      }
      .splash-screen-content {
        flex: 0 0 auto;
        position: relative;
      }

      .splash-screen-logo {
        display: block;
        color: #495057;
      }
      html[data-theme="dark"] .splash-screen-logo {
        color: #ced4da;
      }

      .splash-screen-logo-bg {
        position: absolute;
        z-index: -1;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #dee2e6;
      }
      html[data-theme="dark"] .splash-screen-logo-bg {
        color: #495057;
      }

      .splash-screen-fade-out {
        animation: fade-out 0.5s ease-in-out forwards;
      }

      @keyframes fade-out {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <div class="splash-screen">
      <div class="splash-screen-top"></div>
      <div class="splash-screen-content">
        <svg class="splash-screen-logo" width="132" height="96" viewBox="0 0 132 96" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Antigravity">
          <path d="M43 58L66 12L89 58M52 41H80" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M46 68Q66 78 86 68" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
          <circle cx="93" cy="12" r="4" fill="currentColor"/>
          <text x="66" y="94" fill="currentColor" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="16">Antigravity</text>
        </svg>

        <svg
          class="splash-screen-logo-bg"
          width="660"
          height="660"
          viewBox="0 0 660 660"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <circle
            opacity="0.6"
            cx="331"
            cy="330"
            r="229.75"
            stroke="currentColor"
            stroke-width="0.5"
          />
          <circle
            opacity="0.5"
            cx="330"
            cy="330"
            r="254.75"
            stroke="currentColor"
            stroke-width="0.5"
          />
          <circle
            opacity="0.8"
            cx="330"
            cy="330"
            r="179.75"
            stroke="currentColor"
            stroke-width="0.5"
          />
          <circle
            opacity="0.9"
            cx="331"
            cy="330"
            r="154.75"
            stroke="currentColor"
            stroke-width="0.5"
          />
          <circle
            cx="330"
            cy="330"
            r="129.75"
            stroke="currentColor"
            stroke-width="0.5"
          />
          <circle
            opacity="0.7"
            cx="331"
            cy="330"
            r="204.75"
            stroke="currentColor"
            stroke-width="0.5"
          />
          <circle
            opacity="0.4"
            cx="331"
            cy="330"
            r="279.75"
            stroke="currentColor"
            stroke-width="0.5"
          />
          <circle
            opacity="0.3"
            cx="330"
            cy="330"
            r="304.75"
            stroke="currentColor"
            stroke-width="0.5"
          />
          <circle
            opacity="0.2"
            cx="330"
            cy="330"
            r="329.75"
            stroke="currentColor"
            stroke-width="0.5"
          />
        </svg>
      </div>
      <div class="splash-screen-bottom" id="log-root"></div>
    </div>
    <!--
      Keep a bootstrap-level escape hatch for embedded WebViews. If the module
      graph fails before src/renderer/index.tsx can install its own watchdog,
      the HTML splash must not remain an opaque, permanent cover.
    -->
    <script>
      (() => {
        const revealStartupFailure = (message) => {
          const splash = document.querySelector('.splash-screen')
          if (!splash || splash.dataset.startupFailureShown === 'true') return
          splash.dataset.startupFailureShown = 'true'
          splash.style.opacity = '1'
          splash.style.pointerEvents = 'auto'
          splash.style.zIndex = '99999'
          const detail = document.createElement('div')
          detail.style.cssText = 'position:absolute;left:24px;right:24px;bottom:24px;padding:12px 16px;border-radius:10px;background:rgba(255,255,255,.94);color:#495057;font:14px/1.45 sans-serif;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.12)'
          detail.textContent = message
          splash.appendChild(detail)
        }

        window.addEventListener('error', (event) => {
          const target = event.target
          if (target && target !== window && target.tagName === 'SCRIPT') {
            revealStartupFailure('Antigravity 启动脚本加载失败，请重新打开应用。')
          } else if (event.error) {
            revealStartupFailure('Antigravity 启动异常：' + (event.error.message || 'renderer error'))
          }
        }, true)
        window.addEventListener('unhandledrejection', (event) => {
          const reason = event.reason instanceof Error ? event.reason.message : String(event.reason || 'promise rejection')
          revealStartupFailure('Antigravity 启动异常：' + reason)
        })

        window.setTimeout(() => {
          const root = document.getElementById('root')
          const splash = document.querySelector('.splash-screen')
          if (splash && (!root || root.childElementCount === 0)) {
            revealStartupFailure('Antigravity 启动超时：renderer 未完成加载。')
          }
        }, 12000)
      })()
    </script>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
