import groovy.json.JsonOutput
apply plugin: 'com.android.application'

def signingNames = ['APK_KEYSTORE_PATH', 'APK_KEYSTORE_PASSWORD', 'APK_KEY_ALIAS', 'APK_KEY_PASSWORD']
def signingReady = signingNames.every { System.getenv(it) }
android {
    namespace 'org.chatbox.antigravity'
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId 'org.chatbox.antigravity'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(System.getenv('ANDROID_VERSION_CODE') ?: '1')
        versionName System.getenv('ANDROID_VERSION_NAME') ?: '0.1.0'
        buildConfigField 'String', 'OAUTH_CLIENT_ID', JsonOutput.toJson(System.getenv('ANTIGRAVITY_OAUTH_CLIENT_ID') ?: '')
        buildConfigField 'String', 'OAUTH_CLIENT_SECRET', JsonOutput.toJson(System.getenv('ANTIGRAVITY_OAUTH_CLIENT_SECRET') ?: '')
        aaptOptions { ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~' }
    }
    buildFeatures { buildConfig true }
    testOptions { unitTests.returnDefaultValues = true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
    signingConfigs {
        fixedRelease {
            if (signingReady) {
                storeFile file(System.getenv('APK_KEYSTORE_PATH'))
                storePassword System.getenv('APK_KEYSTORE_PASSWORD')
                keyAlias System.getenv('APK_KEY_ALIAS')
                keyPassword System.getenv('APK_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { if (signingReady) signingConfig signingConfigs.fixedRelease }
        release {
            minifyEnabled true
            shrinkResources true
            if (signingReady) signingConfig signingConfigs.fixedRelease
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
tasks.register('validateReleaseSigning') {
    doLast {
        if (!signingReady) throw new GradleException('Release requires all APK_KEYSTORE_* signing variables; no key is generated.')
        if (!file(System.getenv('APK_KEYSTORE_PATH')).isFile()) throw new GradleException('APK_KEYSTORE_PATH does not identify a keystore file.')
        if (!System.getenv('ANTIGRAVITY_OAUTH_CLIENT_ID')) throw new GradleException('Release requires ANTIGRAVITY_OAUTH_CLIENT_ID.')
    }
}
tasks.configureEach { task -> if (task.name == 'preReleaseBuild') task.dependsOn('validateReleaseSigning') }
repositories { flatDir { dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs' } }
dependencies {
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Annotation types referenced by SQLite's AndroidX Security/Tink dependency.
    implementation 'com.google.errorprone:error_prone_annotations:2.36.0'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.json:json:20240303'
}
apply from: 'capacitor.build.gradle'
