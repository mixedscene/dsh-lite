name: Build DSH Lite APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AGY_CLIENT_ID: ${{ secrets.AGY_CLIENT_ID }}
      AGY_CLIENT_SECRET: ${{ secrets.AGY_CLIENT_SECRET }}
      APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
      APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
      APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare fixed signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PYCODE'
          import os, base64
          names = ['AGY_CLIENT_ID', 'AGY_CLIENT_SECRET', 'APK_KEYSTORE_PASSWORD', 'APK_KEY_ALIAS', 'APK_KEY_PASSWORD', 'KEYSTORE_BASE64']
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing repository Secrets: ' + ', '.join(missing))
          path = os.path.join(os.environ['RUNNER_TEMP'], 'dsh-lite-signing.jks')
          with open(os.environ['GITHUB_ENV'], 'a') as env_file:
              env_file.write('APK_KEYSTORE_PATH=' + path + '\n')
          with open(path, 'wb') as output:
              output.write(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          os.chmod(path, 0o600)
          PYCODE
      - name: Build and lint release
        run: bash ./gradlew --no-daemon assembleRelease lintRelease
      - name: Verify signature and report size
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          python3 - <<'PYCODE'
          import os
          size = os.path.getsize('app/build/outputs/apk/release/app-release.apk')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(f'Signed DSH Lite APK: {size / 1024 / 1024:.2f} MiB\n')
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: DSH-Lite-APK-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.run_number }}
          path: app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 7
