name: Android Antigravity
on:
  push:
    branches: [chatbox-antigravity, chatbox-antigravity-test]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-antigravity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CHATBOX_LITE: '0'
      NODE_OPTIONS: '--max-old-space-size=6144'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate providers and original generation behavior
        run: |
          pnpm exec vitest run src/shared/providers/antigravity src/shared/providers/definitions/models/antigravity.test.ts src/renderer/native src/renderer/utils/mobile-request.test.ts src/renderer/utils/request.test.ts src/renderer/stores/serviceIndependentSettings.test.ts src/renderer/lite src/renderer/adapters/CurrentGenerationService.test.ts src/renderer/stores/session/agent-harness.test.ts src/renderer/packages/model-calls/index.test.ts packages/chatbox-core/src/generation packages/chatbox-core/src/application/session/SessionNamingService.test.ts
          pnpm exec vitest run src/renderer/modals/FileParseError.test.tsx src/renderer/components/Artifact-preview.test.tsx src/shared/providers/codex-client-headers-spec.test.ts src/shared/providers/definitions/models/openai-chat-sse-providers.test.ts src/shared/utils/backup.test.ts src/renderer/packages/remote.test.ts src/renderer/lib/format-chat.test.tsx src/renderer/setup/ga_init.test.ts src/renderer/setup/telemetry_init.test.ts src/renderer/utils/sentry.test.ts src/renderer/utils/track.test.ts src/renderer/platform/web_exporter.test.ts src/renderer/platform/filter_writer.test.ts src/renderer/packages/mcp/controller.test.ts
          pnpm run check
      - name: Build original Chatbox renderer and sync Capacitor
        run: |
          pnpm run mobile:build:original
          pnpm exec cap sync android
          python3 - <<'PYPLUGINS'
          import json
          from pathlib import Path
          expected = {'@capacitor/app', '@capacitor/browser', '@capacitor/keyboard', '@capacitor-community/sqlite', '@capacitor/splash-screen', '@capacitor/app-launcher', '@capacitor/device', '@capacitor/filesystem', '@capacitor/haptics', '@capacitor/share', '@capacitor/toast', 'capacitor-plugin-safe-area', 'capacitor-stream-http'}
          plugins = json.loads(Path('android/app/src/main/assets/capacitor.plugins.json').read_text())
          actual = {plugin['pkg'] for plugin in plugins}
          if actual != expected:
              raise SystemExit(f'Unexpected native plugins: {sorted(actual)}')
          print('Verified native plugins required by the original Chatbox renderer.')
          PYPLUGINS
      - name: Install Android platform on cloud runner
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare persistent external signing key
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PYKEY'
          import base64, os
          from pathlib import Path
          encoded = os.environ.get('APK_KEYSTORE_BASE64', '')
          if not encoded:
              raise SystemExit('Missing persistent APK_KEYSTORE_BASE64 secret; no key will be generated.')
          target = Path(os.environ['RUNNER_TEMP']) / 'chatbox-release.keystore'
          target.write_bytes(base64.b64decode(encoded, validate=True))
          target.chmod(0o600)
          PYKEY
      - name: Verify native boundary and build signed APKs
        env:
          APK_KEYSTORE_PATH: ${{ runner.temp }}/chatbox-release.keystore
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          ANTIGRAVITY_OAUTH_CLIENT_ID: ${{ secrets.AGY_CLIENT_ID }}
          ANTIGRAVITY_OAUTH_CLIENT_SECRET: ${{ secrets.AGY_CLIENT_SECRET }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 0.2.${{ github.run_number }}
        run: bash android/gradlew -p android testDebugUnitTest assembleDebug assembleRelease lintRelease
      - name: Verify APK signing certificate
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk
      - name: Archive source history
        run: git bundle create "$RUNNER_TEMP/chatbox-antigravity.bundle" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: chatbox-antigravity-${{ github.run_number }}
          retention-days: 30
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
            ${{ runner.temp }}/chatbox-antigravity.bundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-validation-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/reports/lint-results-release.*
